<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept 3 · Chapters</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<link rel="stylesheet" href="base.css">
<style>
  /* Six full-screen chapters side by side. Arrow keys, the wheel or the chapter bar move between them. */
  .track { display: flex; height: 100vh; transition: transform .9s cubic-bezier(.7, 0, .2, 1); }
  .chapter { flex: none; width: 100vw; height: 100vh; padding: 92px 96px 120px; position: relative; overflow: hidden; }
  .chapter:nth-child(even) { background: var(--ink-800); }
  .num { position: absolute; right: 60px; top: 40px; font: 500 160px/1 var(--mono); color: var(--bone); opacity: .04; }

  .rise { opacity: 0; translate: 0 26px; transition: opacity .6s var(--ease), translate .7s var(--ease); }
  .chapter.active .rise { opacity: 1; translate: 0 0; transition-delay: calc(.35s + var(--d, 0) * 90ms); }

  .top { position: fixed; inset: 0 0 auto; height: 72px; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; z-index: 10; }
  .top .brand { display: flex; gap: 10px; align-items: center; font-weight: 600; }
  .bar { position: fixed; inset: auto 40px 34px; z-index: 10; display: grid; grid-template-columns: auto 1fr auto; gap: 24px; align-items: center; }
  .chapters { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .chapters button { text-align: left; display: grid; gap: 9px; font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--bone-52); transition: color .3s; }
  .chapters button i { height: 2px; border-radius: 2px; background: var(--line-strong); position: relative; overflow: hidden; }
  .chapters button i::after { content: ""; position: absolute; inset: 0; background: var(--copper); scale: 0 1; transform-origin: left; transition: scale .6s var(--ease); }
  .chapters button.done i::after, .chapters button.on i::after { scale: 1 1; }
  .chapters button.on { color: var(--bone); }
  .arrow { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; font-size: 16px; }
  .arrow:disabled { opacity: .3; }

  h1 { font-size: 112px; line-height: .88; letter-spacing: -.05em; font-weight: 600; }
  h2 { font-size: 68px; line-height: .95; letter-spacing: -.045em; font-weight: 600; }
  .lede { margin-top: 26px; max-width: 46ch; font-size: 18px; line-height: 1.6; color: var(--bone-70); }

  .hello { display: grid; grid-template-columns: 1.4fr 1fr; gap: 60px; align-items: center; height: 100%; }
  .bignums { display: grid; gap: 22px; }
  .bignums div { display: grid; grid-template-columns: 170px 1fr; align-items: baseline; border-top: 1px solid var(--line); padding-top: 18px; }
  .bignums b { font-size: 64px; font-weight: 600; letter-spacing: -.05em; line-height: .9; }
  .bignums span { color: var(--bone-62); font-size: 14px; }

  .work-grid { margin-top: 36px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .project { display: grid; grid-template-columns: 150px 1fr; gap: 18px; padding: 16px; border-radius: 18px; background: var(--ink-900); border: 1px solid var(--line); }
  .project img { width: 150px; height: 300px; object-fit: cover; border-radius: 12px; }
  .project b { display: block; margin-top: 10px; font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
  .project p { margin-top: 10px; font-size: 13.5px; line-height: 1.5; color: var(--bone-70); }
  .project .out { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-weight: 600; font-size: 13.5px; }

  .gantt { margin-top: 44px; position: relative; display: grid; gap: 10px; }
  .gantt .row { position: relative; height: 34px; }
  .gantt .row span { position: absolute; top: 0; height: 34px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--ink-700);
    padding: 0 12px; display: flex; align-items: center; font-size: 13px; white-space: nowrap; overflow: hidden; scale: 0 1; transform-origin: left;
    transition: scale .8s var(--ease); }
  .chapter.active .gantt .row span { scale: 1 1; transition-delay: calc(.5s + var(--d) * 110ms); }
  .gantt .row span.now { border-color: var(--copper); background: var(--copper-wash); }
  .years { position: relative; height: 14px; margin-top: 14px; font: 500 12px/1 var(--mono); color: var(--bone-52); }
  .years span { position: absolute; translate: -50% 0; }
  .years span:first-child { translate: 0 0; }

  .quotes { margin-top: 36px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .quotes article { padding: 22px; border-radius: 18px; border: 1px solid var(--line); background: var(--ink-900); }
  .quotes p { margin-top: 14px; font-size: 17px; line-height: 1.45; }
  .quotes small { display: block; margin-top: 16px; font-size: 12.5px; color: var(--bone-62); }
  .platforms { margin-top: 26px; display: flex; gap: 40px; color: var(--bone-70); }
  .platforms div { display: flex; align-items: center; gap: 10px; }
  .platforms b { font-size: 20px; font-weight: 600; color: var(--bone); }

  .reach { display: grid; grid-template-columns: 380px 1fr; gap: 40px; align-items: center; height: 100%; }
  .reach svg { width: 100%; height: auto; }
  .map-country { fill: var(--copper); fill-opacity: var(--w); stroke: var(--copper-bright); stroke-opacity: .35; stroke-width: .5; }
  .map-arc { fill: none; stroke: var(--copper-bright); stroke-opacity: .75; stroke-width: 1.2; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.2s var(--ease); }
  .chapter.active .map-arc { stroke-dashoffset: 0; transition-delay: calc(.6s + var(--i) * 70ms); }
  .map-dot { fill: var(--bone); }

  .contact { display: grid; grid-template-columns: 1.1fr 1fr; gap: 60px; align-items: center; height: 100%; }
  .channels { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .channels a { padding: 22px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .channels a:nth-child(2n) { border-right: 0; }
  .channels a b { display: block; font-weight: 600; font-size: 16px; }
  .channels a small { display: block; margin-top: 6px; font-size: 12px; color: var(--bone-62); }
  .channels a.primary { background: var(--copper); color: var(--ink-900); }
  .channels a.primary small { color: rgb(10 10 12 / .7); }
</style>
</head>
<body>
<header class="top"><span class="brand">${MARK}</span><span class="status">Open to work</span></header>
<div class="track" id="track"></div>
<nav class="bar">
  <button class="arrow" id="prev" aria-label="Previous chapter">←</button>
  <div class="chapters" id="chapters"></div>
  <button class="arrow" id="next" aria-label="Next chapter">→</button>
</nav>

<script src="data.js"></script>
<script src="shared.js"></script>
<script>
  document.querySelector(".top .brand").innerHTML = `${MARK(24)} MoRmdn`;
  const T = D.totals;
  const pick = (slugs) => slugs.map((s) => D.projects.find((p) => p.slug === s));
  const years = [2021, 2022, 2023, 2024, 2025, 2026];
  const ym = (d) => { const [m, y] = d.split(" "); const i = ["January","February","March","April","May","June","July","August","September","October","November","December"].indexOf(m); return +y + (i < 0 ? 0 : i / 12); };
  const span = (e) => {
    const a = ym(e.startDate), b = e.endDate === "Present" ? 2026.85 : ym(e.endDate);
    return { left: ((a - 2021) / 5.85) * 100, width: ((b - a) / 5.85) * 100 };
  };
  const quotes = shortReviews(150).slice(0, 3);

  const CHAPTERS = [
    ["Hello", `<div class="hello">
      <div><p class="eyebrow rise">Concept 3 · Chapters</p><h1 class="rise" style="--d:1;margin-top:22px">${D.hero.headline.join("<br>")}</h1>
        <p class="lede rise" style="--d:2">Flutter and React Native. Six chapters instead of one long scroll — use the arrow keys, the wheel or the bar below.</p></div>
      <div class="bignums">${[[T.clients, "clients across five marketplaces"], [T.countries, "countries"], [T.reviews, "reviews, all five stars"], [D.metrics.yearsExperience + "+", "years shipping"]]
        .map(([n, l], i) => `<div class="rise" style="--d:${i + 2}"><b class="tabular">${n}</b><span>${l}</span></div>`).join("")}</div></div>`],
    ["Work", `<p class="eyebrow rise">02 / Work</p><h2 class="rise" style="--d:1;margin-top:18px">Built from the first<br>commit to the store.</h2>
      <div class="work-grid">${pick(["lpermis", "saber-yamen", "mutabbib"]).map((p, i) => `<article class="project rise" style="--d:${i + 2}">
        <img src="${img(p.asset, 560)}" alt=""><div><span class="eyebrow">${esc(p.country)}</span><b>${esc(projectName(p))}</b>
        <p>${esc(p.description)}</p><p class="out">${esc(p.achievement)}</p></div></article>`).join("")}</div>`],
    ["Journey", `<p class="eyebrow rise">03 / Journey</p><h2 class="rise" style="--d:1;margin-top:18px">Seven teams,<br>six countries.</h2>
      <div class="gantt">${D.experience.slice().reverse().map((e, i) => { const s = span(e);
        return `<div class="row"><span class="${e.isCurrent ? "now" : ""}" style="--d:${i};left:${s.left}%;width:${s.width}%">${esc(e.company.split("|")[0].trim())} · ${esc(e.country)}</span></div>`; }).join("")}</div>
      <div class="years rise" style="--d:3">${years.map((y) => `<span style="left:${((y - 2021) / 5.85) * 100}%">${y}</span>`).join("")}</div>`],
    ["Proof", `<p class="eyebrow rise">04 / Proof</p><h2 class="rise" style="--d:1;margin-top:18px">${T.reviews} reviews.<br>All five stars.</h2>
      <div class="quotes">${quotes.map((r, i) => `<article class="rise" style="--d:${i + 2}">${stars()}<p>${esc(r.quote)}</p><small>${esc(r.author)} · ${platformLabel(r.platform)}</small></article>`).join("")}</div>
      <div class="platforms rise" style="--d:5">${D.platforms.map((p) => `<div>${mark(p.id, 16)}<b>${p.count}</b></div>`).join("")}</div>`],
    ["Reach", `<div class="reach"><div><p class="eyebrow rise">05 / Reach</p><h2 class="rise" style="--d:1;margin-top:18px">${T.clients} clients.<br>${T.countries} countries.</h2>
      <p class="lede rise" style="--d:2">Every line starts at one desk in Mansoura.</p></div><div class="rise" style="--d:2">${worldSvg()}</div></div>`],
    ["Contact", `<div class="contact"><div><p class="eyebrow rise">06 / Contact</p><h1 class="rise" style="--d:1;margin-top:20px">Got an app<br>to build?</h1>
      <p class="lede rise" style="--d:2">Full-time, contract, or a second pair of hands on a release that's slipping.</p></div>
      <div class="channels rise" style="--d:3">${D.channels.map((c, i) => `<a class="${i ? "" : "primary"}" href="${c.url}"><b>${esc(c.label)}</b><small>${esc(c.note)}</small></a>`).join("")}</div></div>`],
  ];

  const track = document.getElementById("track");
  track.innerHTML = CHAPTERS.map(([, html], i) => `<section class="chapter" data-i="${i}"><span class="num" aria-hidden="true">0${i + 1}</span>${html}</section>`).join("");
  document.getElementById("chapters").innerHTML = CHAPTERS.map(([label], i) => `<button data-go="${i}"><i></i>0${i + 1} ${label}</button>`).join("");

  let at = -1;
  function go(i) {
    i = Math.max(0, Math.min(CHAPTERS.length - 1, i));
    if (i === at) return;
    at = i;
    track.style.transform = `translateX(${-i * 100}vw)`;
    document.querySelectorAll(".chapter").forEach((c, j) => c.classList.toggle("active", j === i));
    document.querySelectorAll("[data-go]").forEach((b, j) => { b.classList.toggle("on", j === i); b.classList.toggle("done", j < i); });
    document.getElementById("prev").disabled = i === 0;
    document.getElementById("next").disabled = i === CHAPTERS.length - 1;
  }
  document.getElementById("prev").onclick = () => go(at - 1);
  document.getElementById("next").onclick = () => go(at + 1);
  document.addEventListener("click", (e) => { const b = e.target.closest("[data-go]"); if (b) go(+b.dataset.go); });
  addEventListener("keydown", (e) => { if (e.key === "ArrowRight") go(at + 1); if (e.key === "ArrowLeft") go(at - 1); });
  let lock = 0;
  addEventListener("wheel", (e) => { const now = Date.now(); if (now - lock < 900 || Math.abs(e.deltaY) < 12) return; lock = now; go(at + (e.deltaY > 0 ? 1 : -1)); }, { passive: true });
  requestAnimationFrame(() => go(0));

  badge("Concept 3 of 5 · Chapters");
</script>
</body>
</html>
