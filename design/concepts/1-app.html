<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept 1 · App mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<link rel="stylesheet" href="base.css">
<style>
  /* Desktop: the pitch on the left, the app in a device on the right. A phone gets the app full screen. */
  .stage { height: 100vh; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 72px; padding: 0 96px; max-width: 1280px; margin: 0 auto; }
  .pitch h1 { margin-top: 20px; font-size: 64px; line-height: .95; letter-spacing: -.04em; font-weight: 600; }
  .pitch p { margin-top: 22px; max-width: 42ch; font-size: 17px; line-height: 1.6; color: var(--bone-70); }
  .pitch .hint { margin-top: 28px; display: flex; gap: 10px; flex-wrap: wrap; }

  .device { position: relative; width: 372px; height: 760px; border-radius: 54px; padding: 12px; background: var(--ink-700);
    border: 1px solid var(--line-strong); box-shadow: 14px 14px 0 -1px var(--ink-800), 14px 14px 0 0 var(--line); }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 44px; overflow: hidden; background: var(--ink-900); isolation: isolate; }
  .notch { position: absolute; top: 10px; left: 50%; translate: -50% 0; width: 110px; height: 30px; border-radius: 20px; background: #000; z-index: 30; }
  .statusbar { position: absolute; inset: 0 0 auto; height: 50px; padding: 16px 28px 0; display: flex; justify-content: space-between;
    font: 600 14px/1 var(--sans); z-index: 25; }
  .statusbar .ico { display: flex; gap: 6px; align-items: center; }

  .views { position: absolute; inset: 0 0 78px; }
  .view { position: absolute; inset: 0; padding: 58px 20px 24px; overflow-y: auto; scrollbar-width: none;
    opacity: 0; translate: 0 10px; pointer-events: none; transition: opacity .28s var(--ease), translate .28s var(--ease); }
  .view::-webkit-scrollbar { display: none; }
  .view.on { opacity: 1; translate: 0 0; pointer-events: auto; }
  .views.pushed .view.on { translate: -30% 0; opacity: .5; transition-duration: .42s; }

  .tabbar { position: absolute; inset: auto 0 0; height: 78px; padding: 8px 10px 22px; display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--ink-800); border-top: 1px solid var(--line); z-index: 20; }
  .tab { display: grid; justify-items: center; gap: 4px; font: 500 10.5px/1 var(--sans); color: var(--bone-52); transition: color .2s; }
  .tab svg { width: 22px; height: 22px; }
  .tab.on { color: var(--bone); }
  .tab.on::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--copper); margin-top: 1px; }

  .large-title { font-size: 30px; font-weight: 600; letter-spacing: -.03em; }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 8px; font: 600 15px/1 var(--sans); }

  .hello { margin-top: 26px; font-size: 32px; line-height: 1.02; letter-spacing: -.035em; font-weight: 600; }
  .hello span { color: var(--bone-52); }
  .stats { margin-top: 18px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { padding: 12px 10px; border-radius: 14px; background: var(--ink-800); border: 1px solid var(--line); }
  .stat b { display: block; font-size: 24px; font-weight: 600; letter-spacing: -.03em; }
  .stat span { font-size: 11px; color: var(--bone-62); }
  .section-h { margin: 24px 0 12px; display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; font-size: 17px; }
  .section-h a { font: 500 12px/1 var(--sans); color: var(--bone-62); }
  .rail { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -20px; padding: 0 20px; scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .card { flex: none; width: 200px; scroll-snap-align: start; border-radius: 18px; overflow: hidden; background: var(--ink-700); border: 1px solid var(--line); text-align: left; }
  .card .art { height: 220px; display: grid; place-items: center; background: var(--ink-600); }
  .card .art img { height: 200px; width: auto; border-radius: 10px; }
  .card .meta { padding: 10px 12px 12px; }
  .card b { font-weight: 600; font-size: 14px; }
  .card small { display: block; margin-top: 3px; font-size: 11px; color: var(--bone-62); }
  .quote { padding: 16px; border-radius: 16px; background: var(--ink-800); border: 1px solid var(--line); }
  .quote p { margin-top: 10px; font-size: 14px; line-height: 1.5; }
  .quote small { display: block; margin-top: 10px; font-size: 11.5px; color: var(--bone-62); }

  .seg { margin-top: 14px; display: inline-flex; padding: 3px; border-radius: 10px; background: var(--ink-700); border: 1px solid var(--line); }
  .seg span { padding: 6px 12px; border-radius: 8px; font-size: 12px; color: var(--bone-62); }
  .seg span.on { background: var(--ink-600); color: var(--bone); }
  .list { margin-top: 14px; }
  .item { width: 100%; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); text-align: left; }
  .item img { width: 52px; height: 52px; border-radius: 13px; }
  .item b { font-weight: 600; font-size: 15px; }
  .item small { display: block; margin-top: 3px; font-size: 11.5px; color: var(--bone-62); }
  .pill { height: 28px; padding: 0 14px; border-radius: 999px; background: var(--ink-600); font: 600 12px/28px var(--sans); color: var(--bone); }

  .detail { position: absolute; inset: 0 0 78px; background: var(--ink-900); z-index: 15; translate: 100% 0; transition: translate .42s var(--ease);
    overflow-y: auto; scrollbar-width: none; box-shadow: -1px 0 0 var(--line); }
  .detail.on { translate: 0 0; }
  .detail .top { position: sticky; top: 0; z-index: 2; padding: 54px 16px 10px; background: var(--ink-900); }
  .back { display: inline-flex; align-items: center; gap: 4px; font-size: 15px; color: var(--bone); }
  .hero-art { margin: 0 20px; height: 300px; border-radius: 20px; background: var(--ink-700); border: 1px solid var(--line); display: flex; gap: 8px; justify-content: center; align-items: center; overflow: hidden; }
  .hero-art img { height: 270px; width: auto; border-radius: 12px; }
  .detail .body { padding: 18px 20px 30px; }
  .detail h2 { font-size: 26px; letter-spacing: -.03em; font-weight: 600; }
  .detail .sub { margin-top: 4px; font-size: 12px; color: var(--bone-62); }
  .detail .desc { margin-top: 14px; font-size: 14.5px; line-height: 1.55; color: var(--bone-78); }
  .outcome { margin-top: 16px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); }
  .outcome .eyebrow { font-size: 9.5px; }
  .outcome p { margin-top: 6px; font-weight: 600; font-size: 14px; }
  .tags { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px; }
  .stores { margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stores span { height: 44px; border-radius: 12px; display: grid; place-items: center; border: 1px solid var(--line-strong); font-weight: 600; font-size: 13px; }

  .filters { margin: 14px -20px 4px; padding: 0 20px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .filters .chip { flex: none; gap: 6px; height: 30px; }
  .filters .chip.on { background: var(--bone); color: var(--ink-900); border-color: var(--bone); }
  .review { margin-top: 12px; }
  .review header { display: flex; justify-content: space-between; align-items: center; color: var(--bone-62); }

  .contact-hero { margin-top: 12px; font-size: 34px; line-height: 1; letter-spacing: -.04em; font-weight: 600; }
  .contact-list { margin-top: 22px; display: grid; gap: 10px; }
  .contact-list a { display: flex; justify-content: space-between; align-items: center; padding: 15px 16px; border-radius: 14px; border: 1px solid var(--line); }
  .contact-list a b { font-weight: 600; font-size: 15px; }
  .contact-list a small { display: block; margin-top: 3px; font-size: 11.5px; color: var(--bone-62); }
  .contact-list a.primary { background: var(--copper); border-color: var(--copper); color: var(--ink-900); }
  .contact-list a.primary small { color: rgb(10 10 12 / .7); }

  @media (max-width: 760px) {
    .stage { display: block; padding: 0; }
    .pitch { display: none; }
    .device { width: 100%; height: 100vh; border-radius: 0; padding: 0; border: 0; box-shadow: none; }
    .screen { border-radius: 0; }
    .notch, .statusbar { display: none; }
  }
</style>
</head>
<body>
<div class="stage">
  <section class="pitch">
    <p class="eyebrow">Concept 1 · App mode</p>
    <h1>The portfolio<br>is the app.</h1>
    <p>Instead of reading about a mobile developer, visitors use one of his apps. Tabs, a pushed detail screen and a swipeable rail — on a phone it simply fills the screen.</p>
    <div class="hint"><span class="chip">Home</span><span class="chip">Work</span><span class="chip">Reviews</span><span class="chip">Contact</span></div>
  </section>

  <div class="device">
    <div class="screen">
      <div class="notch"></div>
      <div class="statusbar"><span>9:41</span><span class="ico"><svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg><svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.5" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/></svg></span></div>

      <div class="views" id="views">
        <section class="view on" data-view="home" id="home"></section>
        <section class="view" data-view="work" id="work"></section>
        <section class="view" data-view="reviews" id="reviews"></section>
        <section class="view" data-view="contact" id="contact"></section>
      </div>
      <section class="detail" id="detail"></section>

      <nav class="tabbar" id="tabbar"></nav>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="shared.js"></script>
<script>
  const ICONS = {
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
    work: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>',
    reviews: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3.5l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.1-5.4 3.1 1.3-6-4.6-4.1 6.1-.6z"/></svg>',
    contact: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  };
  const TABS = [["home", "Home"], ["work", "Work"], ["reviews", "Reviews"], ["contact", "Contact"]];
  document.getElementById("tabbar").innerHTML = TABS.map(([id, label], i) =>
    `<button class="tab ${i ? "" : "on"}" data-tab="${id}">${ICONS[id]}${label}</button>`).join("");

  const T = D.totals;
  const featured = ["lpermis", "saber-yamen", "mutabbib", "mismar", "freedoc"].map((s) => D.projects.find((p) => p.slug === s));
  const sample = shortReviews(170)[2];

  document.getElementById("home").innerHTML = `
    <div class="row"><span class="brand">${MARK(22)}MoRmdn</span><span class="status">Open</span></div>
    <h1 class="hello">Hi, I'm Mohamed.<br><span>${esc(D.hero.headline.join(" "))}</span></h1>
    <div class="stats">
      <div class="stat"><b class="tabular">${T.clients}</b><span>clients</span></div>
      <div class="stat"><b class="tabular">${T.countries}</b><span>countries</span></div>
      <div class="stat"><b class="tabular">${T.reviews}</b><span>5★ reviews</span></div>
    </div>
    <div class="section-h">Featured apps <a data-tab="work">See all</a></div>
    <div class="rail" id="rail">${featured.map((p) => `
      <button class="card" data-project="${p.slug}">
        <div class="art"><img src="${img(p.asset, 280)}" alt=""></div>
        <div class="meta"><b>${esc(projectName(p))}</b><small>${esc(p.category)} · ${esc(p.country)}</small></div>
      </button>`).join("")}</div>
    <div class="section-h">From a client</div>
    <div class="quote">${stars()}<p>${esc(sample.quote)}</p><small>${esc(sample.author)} · ${platformLabel(sample.platform)}</small></div>`;

  document.getElementById("work").innerHTML = `
    <h1 class="large-title">Work</h1>
    <div class="seg"><span class="on">All ${D.projects.length}</span><span>On the stores</span><span>Web</span></div>
    <div class="list">${D.projects.map((p) => `
      <button class="item" data-project="${p.slug}">
        <img src="${img(p.icon, 128)}" alt="">
        <span><b>${esc(projectName(p))}</b><small>${esc(p.category)} · ${esc(p.country)}</small></span>
        <span class="pill">View</span>
      </button>`).join("")}</div>`;

  document.getElementById("reviews").innerHTML = `
    <h1 class="large-title">Reviews</h1>
    <p class="muted" style="margin-top:4px;font-size:13px">${T.reviews} reviews · all five stars</p>
    <div class="filters"><span class="chip on">All</span>${D.platforms.map((p) => `<span class="chip">${mark(p.id, 12)} ${p.count}</span>`).join("")}</div>
    ${shortReviews(200).slice(0, 8).map((r) => `
      <article class="quote review">
        <header>${stars()}<span>${mark(r.platform, 13)}</span></header>
        <p>${esc(r.quote)}</p>
        <small>${esc(r.author)}${r.country ? " · " + esc(r.country) : ""}</small>
      </article>`).join("")}`;

  document.getElementById("contact").innerHTML = `
    <p class="eyebrow" style="margin-top:6px">Contact</p>
    <h1 class="contact-hero">Got an app<br>to build?</h1>
    <p class="muted" style="margin-top:12px;font-size:14px;line-height:1.5">Reply within a day, wherever you write.</p>
    <div class="contact-list">
      <a class="primary" href="${D.contact.whatsapp}"><span><b>WhatsApp</b><small>${esc(D.contact.phone)} · fastest reply</small></span>→</a>
      ${D.channels.filter((c) => c.id !== "whatsapp").map((c) => `<a href="${c.url}"><span><b>${esc(c.label)}</b><small>${esc(c.note)}</small></span>→</a>`).join("")}
    </div>`;

  const views = document.getElementById("views");
  const detail = document.getElementById("detail");

  function showTab(id) {
    closeDetail();
    document.querySelectorAll(".view").forEach((v) => v.classList.toggle("on", v.dataset.view === id));
    document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.tab === id));
    document.querySelector(`.view[data-view="${id}"]`).scrollTop = 0;
  }

  function openDetail(slug) {
    const p = D.projects.find((x) => x.slug === slug);
    const shots = (p.screens.length ? p.screens.slice(0, 2) : [p.asset]).filter(Boolean);
    const from = document.querySelector(".tab.on").textContent.trim();
    detail.innerHTML = `
      <div class="top"><button class="back" data-back>‹ ${esc(from)}</button></div>
      <div class="hero-art">${shots.map((s) => `<img src="${img(s, 280)}" alt="">`).join("")}</div>
      <div class="body">
        <h2>${esc(projectName(p))}</h2>
        <p class="sub">${esc(p.category)} · ${esc(p.country)}</p>
        <p class="desc">${esc(p.description)}</p>
        ${p.achievement ? `<div class="outcome"><p class="eyebrow">Outcome</p><p>${esc(p.achievement)}</p></div>` : ""}
        <div class="tags">${(p.tags || []).map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div>
        ${hasStore(p) ? `<div class="stores"><span> App Store</span><span>▶ Google Play</span></div>`
          : `<p class="eyebrow" style="margin-top:18px">${esc(p.isPrivate ? "Private client · no public listing" : p.linkStatus || "")}</p>`}
      </div>`;
    detail.scrollTop = 0;
    requestAnimationFrame(() => { detail.classList.add("on"); views.classList.add("pushed"); });
  }

  function closeDetail() { detail.classList.remove("on"); views.classList.remove("pushed"); }

  document.addEventListener("click", (e) => {
    const tab = e.target.closest("[data-tab]");
    if (tab) return showTab(tab.dataset.tab);
    const project = e.target.closest("[data-project]");
    if (project) return openDetail(project.dataset.project);
    if (e.target.closest("[data-back]")) closeDetail();
  });

  badge("Concept 1 of 5 · App mode");
</script>
</body>
</html>
